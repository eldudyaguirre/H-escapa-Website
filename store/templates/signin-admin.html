{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H-Escapa - Ingreso al Sistema</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <i class="ring"></i>
        <i class="ring"></i>
        <i class="ring"></i>
        <a class="logo-header" href="{% url 'home' %}">
            <img src="{% static 'img/logo.svg' %}" alt="H-Escapa">
        </a>
        <form class="login-form" action="{% url 'signin' %}" method="post">
            {% csrf_token %}
            <h2>Ingreso</h2>
            {% if messages %}
                {% for message in messages %}
                    <p role="alert">{{ message }}</p>
                {% endfor %}
            {% endif %}
            <div class="input-box">
                <input type="text" name="username" placeholder="Usuario" autocomplete="username" required>
            </div>
            <div class="input-box">
                <input type="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-signin">Ingresar</button>
            <div class="links">
                <a href="#">¿Olvidaste tu contraseña?</a>
                <a href="#">Regístrate</a>
            </div>
        </form>
    </div>
</body>
</html>
